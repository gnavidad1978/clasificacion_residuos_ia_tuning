# ============================================================
# configs/sin_tope/yolo11n_cls.yaml: YOLO11n-cls (CNN de la familia YOLO), SIN TOPE DE EPOCAS
#
# Igual que configs/yolo11n_cls.yaml (misma tasa, optimizador y aumentos), salvo tres cosas,
# recomendadas por la Dra. Lina para dejar que cada modelo pare solo:
#   1. max_epochs sube de 15 a 60: es solo un limite de seguridad, no se espera alcanzarlo.
#   2. El paro temprano vigila la perdida de validacion (val/loss) con paciencia de 6 epocas:
#      se detiene cuando el error de validacion deja de bajar, es decir, cuando las curvas
#      de entrenamiento y validacion empiezan a separarse. El mejor modelo se sigue eligiendo
#      por F1 macro de validacion, la metrica fijada antes de ver resultados.
#   3. La tasa de aprendizaje baja "por meseta" (a la mitad cuando val/loss no mejora en 2
#      epocas) en lugar del coseno, porque el coseno necesita saber de antemano cuantas
#      epocas habra.
#
# Uso:
#   python main.py fit --config configs/sin_tope/yolo11n_cls.yaml --seed_everything 42
# ============================================================


seed_everything: 42        # semilla fija (regla 1 del protocolo)

# ----------------------------------------------------------
# Trainer
# ----------------------------------------------------------
trainer:
  max_epochs: 60           # limite de seguridad; el paro temprano decide
  accelerator: auto        # "cpu" | "gpu" | "auto"
  devices: auto
  precision: "16-mixed"    # "32-true" si no hay GPU
  enable_progress_bar: false   # el avance por epoca lo imprime RegistroResultados

  logger:
    class_path: lightning.pytorch.loggers.TensorBoardLogger
    init_args:
      save_dir: runs
      name: yolo11n_cls_sin_tope   # logs en runs/yolo11n_cls_sin_tope/version_N/
      version: null
      default_hp_metric: false   # quita la grafica hp_metric, que no se usa

  callbacks:
    # Guarda el modelo con mejor F1 macro en validacion (metrica elegida antes de ver resultados)
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/f1
        mode: max
        save_top_k: 1
        filename: "mejor-{epoch:02d}"

    # Se detiene si la perdida de validacion no baja en 6 epocas
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 6
        min_delta: 0.001
        verbose: true

    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

    # Guarda resultados/yolo11n_cls_sin_tope_semilla<N>.json con desempeno y costo
    - class_path: utils.RegistroResultados
      init_args:
        dir_resultados: resultados
        hilos_cpu: 4         # la Raspberry Pi 5 tiene 4 nucleos
        experimento: sin_tope

# ----------------------------------------------------------
# Modelo
# ----------------------------------------------------------
model:
  backbone: yolo11n_cls
  num_classes: 6
  pretrained: true
  optimizer: adamw         # "adamw" | "adam" | "radam" | "sgd"
  lr: 0.0003
  weight_decay: 0.05
  momentum: 0.9            # solo aplica si optimizer=sgd
  programador: meseta      # baja la tasa cuando val/loss deja de mejorar
  paciencia_lr: 2

# ----------------------------------------------------------
# Datos
# ----------------------------------------------------------
data:
  particion_csv: data/particion_semilla42.csv
  raiz_imagenes: data/realwaste
  batch_size: 32
  img_size: 224
  mean: [0.485, 0.456, 0.406]   # valores publicados de ImageNet
  std:  [0.229, 0.224, 0.225]
  num_workers: 2
  giro_grados: 15
  brillo: 0.3
  contraste: 0.3
  saturacion: 0.2
